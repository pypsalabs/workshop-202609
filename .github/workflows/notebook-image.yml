# Builds the single-user notebook image and pushes it to GHCR. It does NOT
# touch the VM - run "Hub reset" to make a new image live for users.
#
# ONE-TIME manual step after the first run: make the GHCR package
# `workshop-notebook` public (org -> Packages -> package -> settings ->
# Change visibility) so the VM pulls it without credentials.
name: Notebook image

on:
  push:
    branches: [main]
    paths:
      - docker/**
      - bham/**
      - pixi.toml
      - pixi.lock
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/pypsalabs/workshop-notebook
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
