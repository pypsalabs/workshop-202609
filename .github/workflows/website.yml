# Builds the Jupyter Book and publishes it to GitHub Pages.
# Repo setting: Pages -> Source must be "GitHub Actions".
name: Website

on:
  push:
    branches: [main]

env:
  # Site is served from https://<org>.github.io/<repo>, so the base path is the repo name.
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, never cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v3

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - uses: prefix-dev/setup-pixi@v0.9.1
        with:
          locked: true

      - name: Build HTML
        run: pixi run jupyter-book build --html --execute

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_build/html

      - id: deployment
        uses: actions/deploy-pages@v4
