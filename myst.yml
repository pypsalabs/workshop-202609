# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  title: PyPSA Workshop Birmingham
  authors:
  - name: Fabian Neumann
  - name: Iegor Riepin
  license: CC-BY-4.0
  open_access: true
  copyright: "2026"
  github: pypsalabs/workshop-202609
  settings:
    output_matplotlib_strings: remove
  # Slide-deck PDFs, copied verbatim into the built site (dev server and HTML
  # export). Each entry lands at the site root under its basename, so a single
  # source file is published at both /<file>.pdf and /bham/<file>.pdf — the two
  # places where the slide pages' iframes resolve `../<file>.pdf`, depending on
  # whether the page URL carries a trailing slash (GitHub Pages redirects to
  # `/bham/<page>/`; the dev server and in-site navigation use `/bham/<page>`).
  static_files:
  - public/bham
  - public/bham/PyPSA-Birmingham.pdf
  - public/bham/PyPSA-Eur-Birmingham.pdf
  toc:
  - file: bham/intro.md
  - file: bham/setup.md
  - file: bham/pypsa-ecosystem.md
  - file: bham/pypsa-eur-model.md
  - file: bham/01-pypsa-intro.ipynb
  - file: bham/02-pypsa-dispatch-problems.ipynb
  - file: bham/03-pypsa-sectors-expansion.ipynb
  - file: bham/04-pypsa-scenarios.ipynb
  - file: bham/05-pypsa-stochastic.ipynb
  - file: bham/annex-python.ipynb
  - file: bham/annex-pandas.ipynb
site:
  options:
    logo: bham/logo-primary-light.svg
    logo_dark: bham/logo-primary-dark.svg
    folders: true
    style: bham/workshop.css
    hide_authors: true
  template: book-theme
